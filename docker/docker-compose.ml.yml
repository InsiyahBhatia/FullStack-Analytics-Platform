version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-finsight_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: finsight
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/warehouse:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finsight_user} -d finsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    container_name: finsight-mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://${DB_USER:-finsight_user}:${DB_PASSWORD}@postgres:5432/finsight
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  fastapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile.fastapi
    container_name: finsight-api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ../models/artifacts:/app/models/artifacts
    depends_on:
      - mlflow

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: finsight-streamlit
    environment:
      API_BASE_URL: http://fastapi:8000
    ports:
      - "8501:8501"
    depends_on:
      - fastapi

volumes:
  pgdata:
  mlflow_artifacts:
