x-logging: &default-logging
  driver: awslogs
  options:
    awslogs-group: /finsight/${ENV:-dev}
    awslogs-region: us-east-1
    awslogs-stream-prefix: docker

x-env: &common-env
  ENV: ${ENV:-dev}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: finsight
  DB_USER: ${DB_USER:-finsight_user}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  AWS_REGION: us-east-1
  S3_DATA_LAKE: finsight-data-lake-${ENV:-dev}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  FINSIGHT_ENV: ${FINSIGHT_ENV:-dev}
  API_KEYS_PROD: ${API_KEYS_PROD:-}
  API_KEYS_DEV: ${API_KEYS_DEV:-}

networks:
  finsight-internal:
    driver: bridge
    internal: true
  finsight-external:
    driver: bridge

services:

  # ── Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-finsight_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: finsight
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/warehouse:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight_user -d finsight"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsight-internal
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ── Cache ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - finsight-internal

  # ── Airflow ──────────────────────────────────────────────────
  airflow-init:
    image: finsight/airflow:${AIRFLOW_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    entrypoint: >
      airflow db init &&
      airflow users create --username admin --password ${AIRFLOW_PASSWORD:?Set AIRFLOW_PASSWORD in .env}
        --firstname Admin --lastname User --role Admin --email admin@finsight.com
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/finsight
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    networks:
      - finsight-internal
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    image: finsight/airflow:latest
    container_name: finsight-airflow-scheduler
    command: scheduler
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/finsight
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - ../data:/opt/airflow/data
    networks:
      - finsight-internal
      - finsight-external
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  airflow-webserver:
    image: finsight/airflow:latest
    container_name: finsight-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/finsight
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
    networks:
      - finsight-external
    depends_on:
      - airflow-scheduler
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  # ── FastAPI ──────────────────────────────────────────────────
  fastapi:
    image: finsight/fastapi:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.fastapi
    container_name: finsight-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../api:/app/api
      - ../models:/app/models
    networks:
      - finsight-internal
      - finsight-external
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ── MLflow Tracking ──────────────────────────────────────────
  mlflow:
    image: finsight/mlflow:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    container_name: finsight-mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/finsight
      --default-artifact-root s3://finsight-data-lake-${ENV:-dev}/mlflow/
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    environment:
      <<: *common-env
    networks:
      - finsight-internal
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Streamlit UI (Internal) ──────────────────────────────────
  frontend:
    image: finsight/streamlit:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: finsight-frontend
    command: streamlit run frontend/src/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      <<: *common-env
      API_BASE_URL: http://fastapi:8000
      WAREHOUSE_URL: postgresql+psycopg2://${DB_USER:-finsight_user}:${DB_PASSWORD}@postgres:5432/finsight
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../models/artifacts:/app/models/artifacts:ro
    networks:
      - finsight-external
    depends_on:
      fastapi:
        condition: service_healthy
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Monitoring ───────────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: finsight-flower
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    networks:
      - finsight-internal
      - finsight-external
    depends_on:
      - redis
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  redisdata:
