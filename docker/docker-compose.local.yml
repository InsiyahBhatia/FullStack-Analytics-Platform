# Local dev override — run with:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# Changes from base:
#   - Logging: awslogs → json-file (works without AWS)
#   - Airflow: builds locally, mounts etl/ + data/, connects to internal postgres
#   - MLflow: uses local artifact store instead of S3

x-env: &local-env
  ENV: dev
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: finsight
  DB_USER: finsight_user
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  FINSIGHT_DATA_DIR: /opt/airflow/data/raw
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:

  # ── Airflow (override for local) ──────────────────────────────
  airflow-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    environment:
      <<: *local-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-finsight_user}:${DB_PASSWORD}@postgres:5432/finsight
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@finsight.com
    volumes:
      - ../etl:/opt/airflow/etl
      - ../data:/opt/airflow/data
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    container_name: finsight-airflow-scheduler
    command: scheduler
    environment:
      <<: *local-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-finsight_user}:${DB_PASSWORD}@postgres:5432/finsight
      PYTHONPATH: /opt/airflow
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - ../etl:/opt/airflow/etl
      - ../models:/opt/airflow/models
      - ../data:/opt/airflow/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  airflow-webserver:
    container_name: finsight-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      <<: *local-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-finsight_user}:${DB_PASSWORD}@postgres:5432/finsight
      PYTHONPATH: /opt/airflow
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - ../etl:/opt/airflow/etl
      - ../models:/opt/airflow/models
      - ../data:/opt/airflow/data
    depends_on:
      - airflow-scheduler
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── MLflow (override for local — no S3) ───────────────────────
  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    container_name: finsight-mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://${DB_USER:-finsight_user}:${DB_PASSWORD}@postgres:5432/finsight_mlflow
      --default-artifact-root /opt/mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    environment:
      <<: *local-env
      MLFLOW_TRACKING_URI: http://finsight-mlflow:5000
    volumes:
      - mlflow-artifacts:/opt/mlflow/artifacts
      - ../models/artifacts:/app/models/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── FastAPI (ML inference API) ───────────────────────────────
  fastapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile.fastapi
    container_name: finsight-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      <<: *local-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../api:/app/api
      - ../models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Streamlit (ML Workbench UI) ─────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: finsight-frontend
    command: streamlit run streamlit/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      <<: *local-env
      API_BASE_URL: http://fastapi:8000
    volumes:
      - ../streamlit:/app/streamlit
      - ../frontend/src:/app/frontend/src
    depends_on:
      fastapi:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Streaming (simulated real-time data) ─────────────────────
  streaming-producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streaming
    container_name: finsight-producer
    command: python -m streaming.producer
    environment:
      <<: *local-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  streaming-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streaming
    container_name: finsight-consumer
    command: python -m streaming.consumer
    environment:
      <<: *local-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  mlflow-artifacts:
